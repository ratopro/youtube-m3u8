services:
  youtube-hls:
    image: ratopro/youtube-m3u8:latest
    container_name: youtube-hls
    environment:
      CACHE_TTL_SECONDS: "1800"
      CACHE_MAX_MB: "512"
      CACHE_MAX_OBJECT_MB: "32"
      LIVE_WINDOW_SEGMENTS: "30"
      PRESENTATION_LOOP_COUNT: "1000"
      STATE_FILE: "data/state.json"
      TZ: "Europe/Madrid"
      APP_TZ: "Europe/Madrid"
      FFMPEG_STARTUP_GRACE_SEC: "60"
      PROCESSED_STARTUP_WAIT_SECONDS: "30"
      PROCESSED_SEGMENT_SECONDS: "1"
      PROCESSED_DELAY_SECONDS: "15"
      VIDEO_ACCEL: "auto"
      PROCESSED_VIDEO_ENCODER: "libx264"
      PRESENTATION_VIDEO_ENCODER: "libx264"
      PROGRAM_HLS_DIR: "/app/data/program_hls"
      PROGRAM_FALLBACK_VIDEO: "/app/data/fallback.mp4"
      MEDIA_DIR: "/app/data/media"
      MAX_UPLOAD_MB: "8192"
      TORRENT_DIR: "/app/data/torrents"
      TORRENT_LISTEN_PORT: "6881"
      TORRENT_PIECE_TIMEOUT: "90"
      TORRENT_METADATA_TIMEOUT: "60"
      INTERNAL_BASE_URL: "http://127.0.0.1:5000"
      USE_GSTREAMER_ENGINE: "1"
      GSTREAMER_HLS_DIR: "/app/data/program_hls"
      GSTREAMER_TARGET_DURATION: "2"
      GSTREAMER_MAX_FILES: "45"
    ports:
      - "5058:5000"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
